name: Release

# Packages the installable build and attaches it to a GitHub Release.
#
# The plugin DLL is committed under release/ rather than compiled here: building it
# needs the game's own Assembly-CSharp.dll and UnityEngine assemblies, which cannot be
# redistributed and so cannot live in CI. Rebuild locally with
# `dotnet build -c Release` in plugin/ and commit the result when the plugin changes.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the build is complete
        run: |
          for f in SoNY.Ita.dll it.csv ui_it.csv README.md; do
            test -f "release/$f" || { echo "missing release/$f"; exit 1; }
          done

      - name: Report translation progress
        id: progress
        # Counted as CSV records, not as physical lines: a handful of translations
        # contain a newline inside the quoted text, so `wc -l` over-reports.
        run: |
          lines=$(python3 -c "
          import csv, io
          rows = list(csv.reader(io.open('release/it.csv', encoding='utf-8-sig', newline='')))
          print(len(rows) - 1)
          ")
          echo "lines=$lines" >> "$GITHUB_OUTPUT"
          echo "$lines translated lines"

      - name: Build the archive
        # The archive carries the full BepInEx/plugins/SoNY-ITA/ path, so unpacking it
        # into the game folder puts every file where it belongs with no manual steps.
        run: |
          mkdir -p dist/BepInEx/plugins/SoNY-ITA
          cp release/SoNY.Ita.dll release/it.csv release/ui_it.csv release/README.md \
             dist/BepInEx/plugins/SoNY-ITA/
          cd dist && zip -r "../SoNY-ITA-${GITHUB_REF_NAME}.zip" BepInEx

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: SoNY-ITA-${{ github.ref_name }}.zip
          body: |
            Unzip into the game folder so the files end up in
            `BepInEx/plugins/SoNY-ITA/`, then pick **Italiano** in the options.

            Requires BepInEx 5.4.x (x64). ${{ steps.progress.outputs.lines }} dialogue
            lines translated; any line the plugin cannot resolve stays in English.

            **Made with AI — expect mistakes.** The text and the plugin were written by
            an AI assistant under human direction and have not yet been proofread by
            anyone playing the game in Italian. Reports of anything that reads wrong are
            welcome.
